<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="homepage.css">

</head>
<body>

<div id="announcement-banner" class="announcement-banner" style="display:none;"></div>

<nav class="site-nav">
  <div class="nav-brand">RTS</div>
  <ul class="nav-links">
    <li><a href="homepage.html">Home</a></li>
    <li><a href="faq.html">FAQ</a></li>
    <li><a href="editors.html">Editors</a></li>
    <li><a href="staff-memories.html" class="active">Staff Memories</a></li>

    <li><a href="admin-login.html">Admin Panel</a></li>

  </ul>

<header class="page-hero memories-hero">
  <h1 class="show-title">Roblox Talent Show</h1>
  <p class="home-subtitle">Staff Memories</p>
  <div class="rainbow-divider"></div>
</header>

<section class="memories-controls-section">
  <p class="memories-count" id="memories-count"></p>
  <div class="controls-bar">
    <select id="filter-year" class="filter-select">
      <option value="">All years</option>
    </select>
    <input type="date" id="filter-exact-date" class="filter-select">
    <button type="button" id="clear-date-filter" class="secondary-btn">Clear date filter</button>
  </div>
</section>

<section class="memories-section">
  <div class="memories-grid" id="memories-grid">
    <p class="crud-empty">Loading memories...</p>
  </div>
</section>

<div class="modal-overlay" id="modal-overlay">
  <div class="employee-modal memory-modal" id="memory-modal">
    <button class="modal-close" id="modal-close" aria-label="Close photo">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<footer class="site-footer">
  <p>&copy; 2026 Roblox Talent Show. Created by ReaperDevCollins.</p>
